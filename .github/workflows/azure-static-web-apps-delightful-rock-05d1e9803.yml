name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - staging

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check build output size
        run: |
          echo "Build output size:"
          du -sh dist/
          echo "Contents of dist folder:"
          ls -la dist/
          echo "Large files in dist (>10MB):"
          find dist/ -size +10M -type f -exec ls -lh {} \; 2>/dev/null || true
          echo "Total workspace size (might include source files):"
          du -sh /github/workspace/
          echo "All files in workspace larger than 50MB:"
          find /github/workspace/ -size +50M -type f -exec ls -lh {} \; 2>/dev/null || true

      - name: Clean build output
        run: |
          # Remove common large unnecessary files
          find dist/ -name "*.map" -delete 2>/dev/null || true
          find dist/ -name "*.tsbuildinfo" -delete 2>/dev/null || true
          find dist/ -name "node_modules" -type d -exec rm -rf {} + 2>/dev/null || true
          find dist/ -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Size after cleanup:"
          du -sh dist/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_ROCK_05D1E9803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_ROCK_05D1E9803 }}
          action: "close"


